name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Verify (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Syntax & Lint Verification
        run: |
          node --check main.js
          node --check preload.js
          node --check overlay-preload.js
          node --check src/core/project-links.js
          node --check src/core/runtime-components.js
          node --check src/renderer/renderer.js

      - name: Build Standalone Packages
        run: npm run pack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
