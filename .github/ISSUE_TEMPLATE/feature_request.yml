name: Feature Request
description: Suggest an idea or enhancement for SmarterGamers DLSS 5 Swapper
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make this tool better? Let us know!
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What feature or enhancement would you like to see?
    validations:
      required: true
  - type: textarea
    id: problem-solved
    attributes:
      label: Problem Solved / Use Case
      description: What problem does this solve or what game/mod setup would benefit?
    validations:
      required: false
